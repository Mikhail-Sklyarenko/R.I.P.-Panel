meta:
  pack_id: generic_dm
  map_id: generic_dm
  mode: deathmatch
  version: "1.1.0"

strategy: single_goal

goal:
  id: mid
  x: 0.50
  y: 0.50
  arrive_radius: 0.08

goals:
  - id: mid
    x: 0.50
    y: 0.50
    arrive_radius: 0.08

routing:
  mode: single
  dwell_at_goal_sec: 30.0
  direct_goal_dist: 0.15

entries: []

at_goal:
  mode: wander
  radius: 0.10
  wander_sec_min: 1.5
  wander_sec_max: 4.0

humanize:
  speed_jitter: 0.12
  micro_pause_chance: 0.012
  micro_pause_sec_min: 0.08
  micro_pause_sec_max: 0.22
  micro_pause_min_interval_sec: 2.5
  turn_rate_deg_per_sec: 100.0
  path_wobble_deg: 3.0
  forward_max_yaw_deg: 48.0
  forward_crawl_yaw_deg: 125.0
  forward_fail_open_after_sec: 0.9
  turn_smooth_alpha: 0.42
  wobble_refresh_sec: 0.85
  forward_jitter_chance: 0.02
  forward_jitter_sec_min: 0.05
  forward_jitter_sec_max: 0.12
  look_yield_turn: true

fallback:
  macro_script: generic_dm
  macro_sec: 60.0
  retry_nav_after_macro: true

stuck:
  progress_timeout_sec: 3.0
  min_progress_norm: 0.008
  escape_duration_sec: 0.55
  escape_angles_deg: [30, -30, 60, -60, 90, -90]
