meta:
  pack_id: dust2_dm
  map_id: de_dust2
  mode: deathmatch
  version: "2.3.0"

strategy: route_cycle

goal:
  id: mid
  x: 0.52
  y: 0.48
  arrive_radius: 0.07

goals:
  - id: mid
    x: 0.52
    y: 0.48
    arrive_radius: 0.07
  - id: bombsite_a
    x: 0.80
    y: 0.16
    arrive_radius: 0.07

# Dense corridor graph — one node per CS2 place-label (RU hud_ref).
waypoints:
  - { id: t_spawn, x: 0.39, y: 0.91, arrive_radius: 0.06 }
  - { id: t_ramp, x: 0.42, y: 0.75, arrive_radius: 0.05 }
  - { id: long, x: 0.30, y: 0.70, arrive_radius: 0.06 }
  - { id: long_doors, x: 0.28, y: 0.55, arrive_radius: 0.05 }
  - { id: pit, x: 0.45, y: 0.55, arrive_radius: 0.05 }
  - { id: mid_doors, x: 0.48, y: 0.52, arrive_radius: 0.05 }
  - { id: mid, x: 0.52, y: 0.48, arrive_radius: 0.07 }
  - { id: mid_upper, x: 0.52, y: 0.38, arrive_radius: 0.05 }
  - { id: outside_tunnel, x: 0.28, y: 0.35, arrive_radius: 0.05 }
  - { id: tunnel, x: 0.22, y: 0.30, arrive_radius: 0.06 }
  - { id: tunnel_stairs, x: 0.20, y: 0.25, arrive_radius: 0.05 }
  - { id: tunnel_upper, x: 0.20, y: 0.22, arrive_radius: 0.05 }
  - { id: b_doors, x: 0.18, y: 0.18, arrive_radius: 0.05 }
  - { id: bombsite_b, x: 0.21, y: 0.12, arrive_radius: 0.07 }
  - { id: short, x: 0.55, y: 0.28, arrive_radius: 0.06 }
  - { id: ledge, x: 0.58, y: 0.32, arrive_radius: 0.05 }
  - { id: under_a, x: 0.78, y: 0.28, arrive_radius: 0.05 }
  - { id: a_ramp, x: 0.72, y: 0.25, arrive_radius: 0.05 }
  - { id: long_a, x: 0.72, y: 0.35, arrive_radius: 0.05 }
  - { id: near_a, x: 0.75, y: 0.20, arrive_radius: 0.05 }
  - { id: bombsite_a, x: 0.80, y: 0.16, arrive_radius: 0.07 }
  - { id: ct_spawn, x: 0.62, y: 0.21, arrive_radius: 0.06 }

edges:
  # T spawn → mid / long
  - [t_spawn, t_ramp]
  - [t_ramp, long]
  - [t_ramp, mid]
  - [long, long_doors]
  - [long_doors, pit]
  - [long_doors, mid]
  - [pit, mid]
  - [pit, mid_doors]
  - [mid_doors, mid]
  - [mid, mid_upper]
  - [mid, short]
  - [mid, outside_tunnel]
  - [mid_upper, short]
  - [mid_upper, ledge]
  # B tunnels
  - [outside_tunnel, tunnel]
  - [tunnel, tunnel_stairs]
  - [tunnel_stairs, tunnel_upper]
  - [tunnel_upper, b_doors]
  - [b_doors, bombsite_b]
  - [tunnel, bombsite_b]
  # A / short / CT
  - [short, ledge]
  - [short, a_ramp]
  - [short, ct_spawn]
  - [ledge, ct_spawn]
  - [a_ramp, near_a]
  - [a_ramp, under_a]
  - [under_a, long_a]
  - [long_a, near_a]
  - [near_a, bombsite_a]
  - [a_ramp, bombsite_a]
  - [ct_spawn, bombsite_a]
  - [ct_spawn, near_a]

routing:
  mode: cycle
  dwell_at_goal_sec: 25.0
  direct_goal_dist: 0.10

entries: []

at_goal:
  mode: wander
  radius: 0.08
  wander_sec_min: 1.5
  wander_sec_max: 4.0

humanize:
  speed_jitter: 0.12
  micro_pause_chance: 0.010
  micro_pause_sec_min: 0.08
  micro_pause_sec_max: 0.22
  micro_pause_min_interval_sec: 2.5
  turn_rate_deg_per_sec: 110.0
  path_wobble_deg: 2.5
  forward_max_yaw_deg: 42.0
  forward_crawl_yaw_deg: 110.0
  forward_fail_open_after_sec: 1.2
  turn_smooth_alpha: 0.42
  wobble_refresh_sec: 0.85
  forward_jitter_chance: 0.015
  forward_jitter_sec_min: 0.05
  forward_jitter_sec_max: 0.12
  look_yield_turn: true

fallback:
  macro_script: generic_dm
  # Short safety only — place hold + abort-on-world own the product path.
  macro_sec: 8.0
  retry_nav_after_macro: true

stuck:
  # Honest stuck: no radar-flow while holding W
  progress_timeout_sec: 3.0
  min_progress_norm: 0.008
  escape_duration_sec: 0.85
  escape_angles_deg: [45, -45, 90, -90, 120, -120]
