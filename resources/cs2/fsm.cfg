// Farm Panel — Deathmatch (adapted from FSM Wingman fsm.cfg)
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"
bind "X_AXIS" "rightleft"
bind "Y_AXIS" "!forwardback"
bind "d" "+right"
bind "a" "+left"
bind "Z_AXIS" "yaw"
bind "R_AXIS" "pitch"
mm_dedicated_search_maxping 400
bind rightarrow "+turnright"; bind leftarrow "+turnleft"
bind k +attack; bind l +attack2
bind j disconnect
player_competitive_maplist_8_10_0_5069769 mg_de_ancient
r_csgo_water_effects 0
bind scancode12 "buy molotov; buy incgrenade;"
r_show_build_info 0
ui_mainmenu_bkgnd_movie_1016BB11$9 de_mirage
// DM: replaced FSM Wingman playsettings (2v2 scrim) with deathmatch
ui_playsettings_mode_official_v20 deathmatch
game_type 1
game_mode 2
cl_dm_buyrandomweapons 0
bind w +forward
bind s +back
bind e +use
bind CTRL +duck
bind SHIFT +sprint
bind 1 slot1
bind 2 slot2
bind 3 slot3
bind scancode39 "buy defuser"
// Autobuy rifle: CS2 buy names (m4a1 = M4A4 only; CT silencer = m4a1_silencer)
alias buy_rifle_dm "buy ak47; buy m4a1_silencer; buy m4a1; buy m4a4; buy vesthelm"
bind f5 "buy_rifle_dm"
bind scancode63 "buy_rifle_dm"
bind insert "buy_rifle_dm"
bind o "buy_rifle_dm"
bind p "buy_rifle_dm"
echo "farm_panel cfg loaded"
